<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>StreamCoreTV Web Runtime</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090b10;
        }

        body {
            font-family: system-ui, sans-serif;
            position: relative;
        }

        #streamcore-playback-video-layer,
        #streamcore-compose-root {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #streamcore-playback-video-layer {
            z-index: 0;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
            background: #000;
        }

        #streamcore-compose-root {
            z-index: 1;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="streamcore-playback-video-layer" aria-hidden="true"></div>
<div id="streamcore-compose-root"></div>
<script src="/streamcore-web.js"></script>
</body>
</html>
